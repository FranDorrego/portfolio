# Verifica el codigo en cada push y mantiene al dia las estadisticas de GitHub.
# El despliegue lo hace ArduMaker: cada push a main vuelve a publicar el sitio en el VPS.
name: Sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: sitio
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # La API del panel /admin/: sus pruebas corren contra un PostgreSQL de verdad.
  api-del-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prueba
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prueba" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: admin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://prueba:prueba@localhost:5432/prueba

  # La API del panel se despliega desde la rama `api` (ArduMaker no permite dos apps de la misma
  # rama). Esta rama es un espejo de main: cuando las pruebas pasan, se adelanta hasta main y
  # eso dispara el despliegue de la API.
  rama-api:
    needs: [verificar, api-del-panel]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/api --force

  # Vuelve a leer la actividad de GitHub y, si cambio, la guarda en el repositorio: ese commit
  # es el que hace que ArduMaker publique el sitio con las cifras nuevas.
  estadisticas:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin GH_STATS_TOKEN se usa el token de la accion, que solo ve la actividad publica.
      - run: node scripts/estadisticas-de-github.mjs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Guardar si cambio
        env:
          MENSAJE: >-
            Estadisticas de GitHub al dia: la accion diaria volvio a leer commits, pull
            requests, merges y el mapa de contribuciones, y guarda el archivo que muestra el
            sitio para que ArduMaker lo publique
        run: |
          git add public/github-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MENSAJE"
          git push

  # El CV en PDF (lo que leen los ATS): si el curriculum cambio, lo vuelve a imprimir desde /cv/
  # y lo guarda en el repositorio. Si no cambio, no instala nada ni sube nada.
  cv:
    needs: estadisticas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ver si el curriculum cambio
        id: huella
        run: |
          nueva=$(cat dist/cv/index.html dist/pt/cv/index.html | sha256sum | cut -d' ' -f1)
          anterior=$(cat public/cv-franco-dorrego.sha256 2>/dev/null || true)
          if [ "$nueva" = "$anterior" ]; then echo "cambio=no" >> "$GITHUB_OUTPUT"; fi
      - if: steps.huella.outputs.cambio != 'no'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/imprimir-cv.mjs
      - if: steps.huella.outputs.cambio != 'no'
        name: Guardar si cambio
        env:
          MENSAJE: >-
            CV en PDF al dia: el curriculum cambio y la accion lo volvio a imprimir desde /cv/
            en español y en portugués, para que ArduMaker lo publique
        run: |
          git add public/cv-franco-dorrego.pdf public/cv-franco-dorrego-pt.pdf public/cv-franco-dorrego.sha256
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MENSAJE"
          git pull --rebase origin main
          git push
