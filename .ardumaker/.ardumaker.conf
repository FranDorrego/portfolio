// ArduMaker: la configuracion de este proyecto.
//
// Todo lo de aca es opcional. Sin este archivo rige el estandar tal cual, que es lo que
// corresponde salvo que haya un motivo. Cada cosa que se afloja queda escrita, commiteada y a la
// vista en el diff: eso es lo que hace que sea una decision y no una fuga.
//
// Se admiten comentarios en renglones enteros, como estos.
{
  // Carpetas y archivos donde no se entra ni se revisa. Sin comodines vale como carpeta o
  // archivo exacto; con comodines se compara como un glob.
  "ignore": [
    // "docs/generado",
    // "**/*.min.js"
  ],

  // El largo de linea. El estandar son 100 de objetivo (aviso) y 170 de tope (error).
  "line_length": {
    // "target": 100,
    // "max": 170
  },

  // Apagar reglas o cambiarles la gravedad. Vale el ID entero -"FMT-003"- o la familia -"LANG"-.
  "rules": {
    "off": [
      // "LANG"
    ],
    "warn": [
      // "PY-002"
    ],
    "error": [
    ]
  },

  // Archivos que pueden estar aunque una regla los objete. Por regla, o "*" para todas.
  "allow": {
    // "REPO-012": ["assets/video/**"],
    // "SEC-001": ["tests/fixtures/*.pem"]
  }
}
