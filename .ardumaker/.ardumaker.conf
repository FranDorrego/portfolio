// Lo que este proyecto ajusta del estandar, y por que. Va en git a proposito:
// una regla aflojada tiene que verse en el diff.
{
  "ignore": [
    "dist",
    // Lo escribe la accion diaria (scripts/estadisticas-de-github.mjs): JSON en un renglon.
    "public/github-stats.json"
  ],

  "allow": {
    // Una frase no se parte en dos: el salto quedaria adentro del texto que lee la persona.
    // El catalogo y los archivos de idioma son prosa, no codigo. En index.html la linea larga
    // es el contenido de un <meta>, y el icono en vector es un solo renglon de trazos.
    "FMT-003": [
      "src/data/proyectos/*.ts",
      "src/i18n/es.ts",
      "src/i18n/pt.ts",
      "src/data/testimonios.ts",
      "admin-api/app/base_cv.json",
      "index.html",
      "public/*.svg"
    ],
    "FMT-004": [
      "admin-api/app/base_cv.json",
      "src/data/proyectos/*.ts",
      "src/i18n/es.ts",
      "src/i18n/pt.ts",
      "index.html",
      "public/*.svg"
    ],
    // Son contenido, no la direccion de una API: el perfil de LinkedIn del autor y el sitio
    // publico de un proyecto. No cambian entre entornos.
    // En la prueba de la raiz son direcciones de ejemplo: de eso trata la prueba.
    // Las opiniones de clientes enlazan a su ficha publica de Workana, y resume.json declara el
    // esquema publico de JSON Resume.
    "WEB-026": [
      "src/servidor/resume-json.ts",
      "src/data/perfil.ts",
      "src/data/formacion.ts",
      "src/data/testimonios.ts",
      "src/data/proyectos/*.ts",
      "src/lib/raiz.test.ts"
    ],
    // El sitio tiene un solo tema, el oscuro, fijo en el HTML: no hay nada que cambiar antes de
    // pintar ni un color de barra que actualizar.
    "WEB-010": ["index.html"],
    // El panel /admin/ (src/admin y admin-api) lo usa una sola persona y solo en espanol: sus
    // textos viven junto a su codigo, no en los archivos de idioma del sitio.
    "WEB-012": ["src/admin/*.tsx"],
    "LANG-004": ["admin-api/app/*.py", "admin-api/app/rutas/*.py"],
    "WEB-011": ["index.html"]
  }
}
