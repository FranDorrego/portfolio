    <!--
      El idioma antes del primer dibujo: quien llega a la raiz con el equipo en portugues o en
      ingles (o que ya eligio portugues) va a /pt/. Misma regla que idiomaPreferido() en
      src/i18n/idioma-inicial.ts. Los buscadores y agentes se quedan en el espanol.
    -->
    <script>
      (function () {
        try {
          if (location.pathname !== '/') return;
          if (
            /bot|crawl|spider|slurp|preview|lighthouse|headless|gptbot|claude|perplexity/i.test(
              navigator.userAgent,
            )
          )
            return;
          var guardado = null;
          try {
            guardado = localStorage.getItem('portfolio-idioma');
          } catch (e) {
            /* sin almacenamiento */
          }
          var idioma = guardado;
          if (idioma !== 'es' && idioma !== 'pt') {
            idioma = 'es';
            var lista =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || ''];
            for (var i = 0; i < lista.length; i++) {
              var c = String(lista[i]).toLowerCase();
              if (c.indexOf('es') === 0) break;
              if (c.indexOf('pt') === 0 || c.indexOf('en') === 0) {
                idioma = 'pt';
                break;
              }
            }
          }
          if (idioma === 'pt') location.replace('/pt/' + location.hash);
        } catch (e) {
          /* si algo falla, se queda en espanol */
        }
      })();
    </script>

    <!-- El tema antes del primer dibujo: el elegido, o el oscuro. Misma regla que src/lib/tema.ts. -->
    <script>

        var tema = 'dark';
        try {
          if (localStorage.getItem('portfolio-tema') === 'light') tema = 'light';
        } catch (e) {

        }
        document.documentElement.classList.toggle('dark', tema === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'dark' ? '#151619' : '#ffffff');
      })();
