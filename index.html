    <!-- El tema antes del primer dibujo: el elegido, o el oscuro. Misma regla que src/lib/tema.ts. -->
    <script>
      (function () {
        var tema = 'dark';
        try {
          if (localStorage.getItem('portfolio-tema') === 'light') tema = 'light';
        } catch (e) {
          /* sin almacenamiento: el oscuro */
        }
        document.documentElement.classList.toggle('dark', tema === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'dark' ? '#151619' : '#ffffff');
      })();
    </script>
